              - heading "核心原则" [level=3] [ref=e210]
              - paragraph [ref=e211]:
                - strong [ref=e212]: 全面性第一
                - text: ：你必须穷尽检索范围内所有可获取的相关资料，逐一列出，禁止筛选、精简或「挑几个代表性的」。如果检索结果超过 50 条，分批输出并确保无遗漏。低于「最少收集数量」视为任务未完成。
              - paragraph [ref=e213]:
                - strong [ref=e214]: 禁止敷衍
                - text: ：任何形式的偷懒——如只列 3-4 条然后说「等」、用「包括但不限于」跳过列举、合并多条为一条——都属于违规。每条资料必须独立列出，拥有完整的四要素。
              - heading "执行要求" [level=3] [ref=e215]
              - list [ref=e216]:
                - listitem [ref=e217]:
                  - strong [ref=e218]: 多策略检索
                  - text: ：
              - list [ref=e219]:
                - listitem [ref=e220]: 至少使用 3 组不同关键词组合进行检索
                - listitem [ref=e221]: 每组关键词覆盖不同角度和语言表述
                - listitem [ref=e222]: 对每个搜索结果页进行翻页，确保不遗漏后续页面内容
                - listitem [ref=e223]: 若「优先信源类型」为空，则覆盖全部信源类型；若指定了类型，则优先检索对应类型
              - list [ref=e224]:
                - listitem [ref=e225]:
                  - strong [ref=e226]: 去重与验证
                  - text: ：
              - list [ref=e227]:
                - listitem [ref=e228]: 同一条信息被多个媒体报道的，列出所有来源而非只保留一个
                - listitem [ref=e229]: 明显为机器聚合或抄袭转载的内容标注「衍生/转载」
                - listitem [ref=e230]: 标注每条资料的发布/更新时间
              - list [ref=e231]:
                - listitem [ref=e232]:
                  - strong [ref=e233]: 信息提取
                  - text: ：
              - list [ref=e234]:
                - listitem [ref=e235]: 从每篇资料中提取核心观点，禁止仅靠标题概括
                - listitem [ref=e236]: 核心观点使用中文表述，保留关键数据、人名、机构名
                - listitem [ref=e237]: 若原文为非中文，标题栏同时列出中文翻译和原文
              - heading "输出格式" [level=3] [ref=e238]
