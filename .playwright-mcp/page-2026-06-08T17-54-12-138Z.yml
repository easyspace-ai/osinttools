                - listitem [ref=e243]: 原始链接：https://...
                - listitem [ref=e244]: 核心观点：[2-4句话概括该资料的核心事实、论点或数据]
              - paragraph [ref=e245]: （持续列举直到全部输出完毕）
              - heading "完成标准" [level=3] [ref=e246]
              - list [ref=e247]:
